# Acquisition overlay (opt-in). Use together with compose.yaml:
#   docker compose --env-file .env.docker -f compose.yaml -f compose.acquisition.yaml ...
# Adds the internal acquisition service (real SofaScore provider, fixed recipe), its administrative command and the
# update control: the backend runs in control mode (control.py, owner of the coordinator) and Next offers
# /api/v1/updates to an operator session (docs/contrato-actualizaciones.md).
# Procedure, limits and what is and is not observed: docs/docker.md, section "Adquisición".
#
# Boundaries:
# - acquisition never mounts the sporting volume, its journal or copies: only its profile, its jobs and the secret.
# - backend reaches acquisition only through acquisition-control (internal, no egress); no host port.
# - acquisition-egress is the only network with Internet access. Docker does not filter it by domain.
# - The two acquisition volumes are new and empty: the first mount copies the image's empty /profiles and
#   /acquisition-jobs, owned by UID 10001 (no root chown). Never point them at a volume with other content.
services:
  backend:
    # Control mode: the same sporting routes and /health, served from the current generation of the coordinator.
    command: [control.py, --base, /state/real-jaen.sqlite, --ambito, /app/ambito.json, --host, 0.0.0.0, --port, "8001"]
    environment:
      RJ_ACQUISITION_URL: http://acquisition:8002
      RJ_ACQUISITION_SECRET_FILE: /run/secrets/acquisition-token
      RJ_CONTROL_SECRET_FILE: /run/secrets/control-token
    volumes:
      - type: bind
        source: ${RJ_ACQUISITION_SECRET_FILE:?Define RJ_ACQUISITION_SECRET_FILE as an existing secret file outside code and images}
        target: /run/secrets/acquisition-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RJ_CONTROL_SECRET_FILE:?Define RJ_CONTROL_SECRET_FILE as an existing secret file outside code and images}
        target: /run/secrets/control-token
        read_only: true
        bind:
          create_host_path: false
    networks: [default, acquisition-control]

  # The Next server checks the operator session and calls the backend with the control secret; the browser never
  # receives either secret, and the frontend never has the acquisition token.
  frontend:
    environment:
      RJ_CONTROL_SECRET_FILE: /run/secrets/control-token
      RJ_OPERATOR_KEY_FILE: /run/secrets/operator-key
    volumes:
      - type: bind
        source: ${RJ_CONTROL_SECRET_FILE:?Define RJ_CONTROL_SECRET_FILE as an existing secret file outside code and images}
        target: /run/secrets/control-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RJ_OPERATOR_KEY_FILE:?Define RJ_OPERATOR_KEY_FILE as an existing operator key file outside code and images}
        target: /run/secrets/operator-key
        read_only: true
        bind:
          create_host_path: false

  acquisition:
    build:
      context: ${RJ_BACKEND_CONTEXT:-../api-real-jaen}/docker/acquisition
      dockerfile: Dockerfile
      target: runtime
      network: none
      additional_contexts:
        implementation: ${RJ_BACKEND_CONTEXT:-../api-real-jaen}/acquisition
        backend: ${RJ_BACKEND_CONTEXT:-../api-real-jaen}
      args:
        PROFILE_RUNTIME: ${RJ_SCRAPER_RUNTIME_IMAGE:?Define RJ_SCRAPER_RUNTIME_IMAGE as the audited scraper runtime image built from docker/scraper}
    image: ${RJ_ACQUISITION_IMAGE:-${COMPOSE_PROJECT_NAME:-rj-analyst-local}-acquisition:local}
    entrypoint: [python, -B, -m, acquisition.service]
    init: true
    restart: unless-stopped
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${RJ_BACKEND_CONTEXT:-../api-real-jaen}/docker/acquisition/seccomp-linux-amd64.json
    shm_size: 512m
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    environment:
      ACQ_PROVIDER: sofascore
      ACQ_ENABLE_REAL: ${RJ_ACQUISITION_ENABLE_REAL:?Set RJ_ACQUISITION_ENABLE_REAL=1 to allow the real provider}
      ACQ_SECRET_FILE: /run/secrets/acquisition-token
    volumes:
      - type: volume
        source: acquisition-profiles
        target: /profiles
      - type: volume
        source: acquisition-jobs
        target: /acquisition-jobs
      - type: bind
        source: ${RJ_ACQUISITION_SECRET_FILE:?Define RJ_ACQUISITION_SECRET_FILE as an existing secret file outside code and images}
        target: /run/secrets/acquisition-token
        read_only: true
        bind:
          create_host_path: false
    networks: [acquisition-control, acquisition-egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Administrative profile commands (initialize, verify, manual recovery), only with the service stopped.
  acquisition-admin:
    profiles: [admin]
    image: ${RJ_ACQUISITION_IMAGE:-${COMPOSE_PROJECT_NAME:-rj-analyst-local}-acquisition:local}
    pull_policy: never
    entrypoint: [python, -B, -m, acquisition.admin]
    init: true
    network_mode: none
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${RJ_BACKEND_CONTEXT:-../api-real-jaen}/docker/acquisition/seccomp-linux-amd64.json
    shm_size: 512m
    volumes:
      - type: volume
        source: acquisition-profiles
        target: /profiles

networks:
  acquisition-control:
    internal: true
  acquisition-egress: {}

volumes:
  acquisition-profiles:
    external: true
    name: ${RJ_ACQUISITION_PROFILE_VOLUME:?Define an explicitly created external volume RJ_ACQUISITION_PROFILE_VOLUME}
  acquisition-jobs:
    external: true
    name: ${RJ_ACQUISITION_JOBS_VOLUME:?Define an explicitly created external volume RJ_ACQUISITION_JOBS_VOLUME}
